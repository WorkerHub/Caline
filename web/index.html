<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Caline</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --card: #f8fafc;
        --radius: 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #090d16;
          --text: #f8fafc;
          --muted: #94a3b8;
          --border: #1e293b;
          --primary: #3b82f6;
          --primary-hover: #60a5fa;
          --card: #0f172a;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        border-bottom: 1px solid var(--border);
        background-color: var(--card);
        padding: 16px 24px;
      }
      .header-inner {
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--text);
      }
      .brand-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      .admin-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 500;
        border-radius: var(--radius);
        background-color: var(--primary);
        color: #ffffff;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      .admin-btn:hover {
        background-color: var(--primary-hover);
      }
      main {
        flex: 1;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        padding: 32px 24px;
      }
      #caline {
        margin-top: 16px;
      }
      footer {
        border-top: 1px solid var(--border);
        padding: 16px 24px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      footer a {
        color: inherit;
        text-decoration: none;
        transition: color 0.15s ease;
      }
      footer a:hover {
        color: var(--primary);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a href="/" class="brand">
          <span class="brand-title">Caline</span>
        </a>
        <a href="/ui" class="admin-btn">管理后台</a>
      </div>
    </header>

    <main>
      <section>
        <div id="caline"></div>
      </section>
    </main>

    <footer>
      <p>
        <a href="https://github.com/WorkerHub/Caline" target="_blank" rel="noopener noreferrer">Caline</a> · 简洁轻量的自托管评论系统
      </p>
    </footer>

    <script src="/client/v1.js"></script>
    <script>
      ;(() => {
        if (typeof Caline !== "undefined" && typeof Caline.init === "function") {
          Caline.init({
            el: "#caline",
            path: "/",
            serverURL: window.location.origin
          })
        }
      })()
    </script>
  </body>
</html>
